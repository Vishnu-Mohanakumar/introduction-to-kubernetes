---
# PostgreSQL Headless Service (for StatefulSet)
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: todo-app
  labels:
    app: postgres
    component: database
spec:
  clusterIP: None
  selector:
    app: postgres
    component: database
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres

---
# PostgreSQL Service (for external access)
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: todo-app
  labels:
    app: postgres
    component: database
spec:
  type: ClusterIP
  selector:
    app: postgres
    component: database
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: todo-app
  labels:
    app: redis
    component: cache
spec:
  type: ClusterIP
  selector:
    app: redis
    component: cache
  ports:
  - port: 6379
    targetPort: 6379
    name: redis

---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: todo-app
  labels:
    app: backend
    component: api
spec:
  type: ClusterIP
  selector:
    app: backend
    component: api
  ports:
  - port: 5000
    targetPort: 5000
    name: http

---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: todo-app
  labels:
    app: frontend
    component: web
spec:
  type: NodePort
  selector:
    app: frontend
    component: web
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
    name: http