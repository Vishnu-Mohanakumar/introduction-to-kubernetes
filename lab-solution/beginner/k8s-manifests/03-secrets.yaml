---
# Secret for database credentials
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: todo-app
  labels:
    app: postgres
    component: database
type: Opaque
data:
  # todopass base64 encoded
  POSTGRES_PASSWORD: dG9kb3Bhc3M=
  DB_PASSWORD: dG9kb3Bhc3M=
  # Base64 encoded: replicator_password - used by replicas to stream from the primary
  POSTGRES_REPLICATION_PASSWORD: cmVwbGljYXRvcl9wYXNzd29yZA==

---
# Secret for application keys
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: todo-app
  labels:
    app: backend
    component: api
type: Opaque
data:
  # JWT secret key (base64 encoded random string)
  JWT_SECRET: bXlfc2VjcmV0X2p3dF9rZXlfdGhhdF9pc19yZWFsbHlfc2VjdXJl
  # API key (base64 encoded)
  API_KEY: YXBpX2tleV8xMjM0NTY3ODkw