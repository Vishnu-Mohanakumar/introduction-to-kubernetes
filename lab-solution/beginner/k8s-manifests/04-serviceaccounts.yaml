---
# ServiceAccount for PostgreSQL
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-sa
  namespace: todo-app
  labels:
    app: postgres
    component: database

---
# ServiceAccount for Backend
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: todo-app
  labels:
    app: backend
    component: api

---
# ServiceAccount for Frontend
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: todo-app
  labels:
    app: frontend
    component: web

---
# ServiceAccount for Redis
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-sa
  namespace: todo-app
  labels:
    app: redis
    component: cache