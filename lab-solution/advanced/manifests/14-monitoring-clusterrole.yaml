apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring-sa
  namespace: voting-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-lister
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitoring-pod-lister
subjects:
  - kind: ServiceAccount
    name: monitoring-sa
    namespace: voting-app
roleRef:
  kind: ClusterRole
  name: pod-lister
  apiGroup: rbac.authorization.k8s.io
