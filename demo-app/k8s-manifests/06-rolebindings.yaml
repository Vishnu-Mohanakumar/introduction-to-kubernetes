---
# RoleBinding to bind demo-app-role to demo-app-sa in demo-app namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-app-rolebinding
  namespace: demo-app
  labels:
    app: demo-app
    component: rbac
  annotations:
    description: "Binds demo-app-role to demo-app-sa service account"
subjects:
- kind: ServiceAccount
  name: demo-app-sa
  namespace: demo-app
roleRef:
  kind: Role
  name: demo-app-role
  apiGroup: rbac.authorization.k8s.io
---
# ClusterRoleBinding to bind demo-app-cluster-role to demo-app-sa
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: demo-app-cluster-rolebinding
  labels:
    app: demo-app
    component: rbac
  annotations:
    description: "Binds demo-app-cluster-role to demo-app-sa service account"
subjects:
- kind: ServiceAccount
  name: demo-app-sa
  namespace: demo-app
roleRef:
  kind: ClusterRole
  name: demo-app-cluster-role
  apiGroup: rbac.authorization.k8s.io