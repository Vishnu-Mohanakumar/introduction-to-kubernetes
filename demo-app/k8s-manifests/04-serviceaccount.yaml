---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-app-sa
  namespace: demo-app
  labels:
    app: demo-app
    component: rbac
  annotations:
    description: "Service account for the demo application"
automountServiceAccountToken: true
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-app-sa-token
  namespace: demo-app
  annotations:
    kubernetes.io/service-account.name: demo-app-sa
    description: "Token for demo-app service account"
type: kubernetes.io/service-account-token