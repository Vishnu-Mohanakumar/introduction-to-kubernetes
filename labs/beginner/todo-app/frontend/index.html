<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubernetes Todo App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #326ce5 0%, #0056d3 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .stat-card {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #326ce5;
            display: block;
        }

        .stat-label {
            font-size: 0.9em;
            color: #6c757d;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .add-todo {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .todo-input {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .todo-input:focus {
            outline: none;
            border-color: #326ce5;
        }

        .priority-select {
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            background: white;
        }

        .add-btn {
            background: #326ce5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .add-btn:hover {
            background: #0056d3;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e9ecef;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: #326ce5;
            color: white;
            border-color: #326ce5;
        }

        .todo-list {
            margin-top: 20px;
        }

        .todo-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #326ce5;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .todo-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .todo-item.completed {
            opacity: 0.7;
            border-left-color: #28a745;
        }

        .todo-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .todo-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #2c3e50;
        }

        .todo-item.completed .todo-title {
            text-decoration: line-through;
            color: #6c757d;
        }

        .priority-badge {
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: 600;
            text-transform: uppercase;
        }

        .priority-high {
            background: #ff6b6b;
            color: white;
        }

        .priority-medium {
            background: #ffa726;
            color: white;
        }

        .priority-low {
            background: #66bb6a;
            color: white;
        }

        .todo-description {
            color: #6c757d;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .todo-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .todo-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s ease;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .todo-date {
            font-size: 0.8em;
            color: #adb5bd;
            margin-left: auto;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 600px) {
            .add-todo {
                flex-direction: column;
            }

            .todo-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .priority-badge {
                margin-top: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Kubernetes Todo App</h1>
            <p>Demonstrating StatefulSets, Services, and RBAC</p>
        </div>

        <div class="stats" id="stats">
            <!-- Stats will be populated by JavaScript -->
        </div>

        <div class="content">
            <div id="error-container"></div>

            <div class="add-todo">
                <input type="text" id="todo-title" class="todo-input" placeholder="Enter todo title..." maxlength="200">
                <input type="text" id="todo-description" class="todo-input" placeholder="Description (optional)..." maxlength="500">
                <select id="todo-priority" class="priority-select">
                    <option value="low">Low Priority</option>
                    <option value="medium" selected>Medium Priority</option>
                    <option value="high">High Priority</option>
                </select>
                <button onclick="addTodo()" class="add-btn">Add Todo</button>
            </div>

            <div class="filters">
                <button class="filter-btn active" onclick="filterTodos('all')">All</button>
                <button class="filter-btn" onclick="filterTodos('pending')">Pending</button>
                <button class="filter-btn" onclick="filterTodos('completed')">Completed</button>
                <button class="filter-btn" onclick="filterTodos('high')">High Priority</button>
            </div>

            <div id="todo-list" class="todo-list">
                <div class="loading">Loading todos...</div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE = window.location.origin.includes('localhost') 
            ? 'http://localhost:5000/api' 
            : '/api';
        
        let todos = [];
        let currentFilter = 'all';

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            loadTodos();
            loadStats();
            
            // Auto-refresh every 30 seconds
            setInterval(() => {
                loadTodos();
                loadStats();
            }, 30000);
        });

        // Load todos from API
        async function loadTodos() {
            try {
                const response = await fetch(`${API_BASE}/todos`);
                if (!response.ok) throw new Error('Failed to load todos');
                
                todos = await response.json();
                renderTodos();
                clearError();
            } catch (error) {
                console.error('Error loading todos:', error);
                showError('Failed to load todos. Please check if the backend service is running.');
            }
        }

        // Load statistics
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`);
                if (!response.ok) throw new Error('Failed to load stats');
                
                const stats = await response.json();
                renderStats(stats);
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Render statistics
        function renderStats(stats) {
            const statsContainer = document.getElementById('stats');
            statsContainer.innerHTML = `
                <div class="stat-card">
                    <span class="stat-number">${stats.total}</span>
                    <div class="stat-label">Total</div>
                </div>
                <div class="stat-card">
                    <span class="stat-number">${stats.pending}</span>
                    <div class="stat-label">Pending</div>
                </div>
                <div class="stat-card">
                    <span class="stat-number">${stats.completed}</span>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-card">
                    <span class="stat-number">${stats.high_priority}</span>
                    <div class="stat-label">High Priority</div>
                </div>
            `;
        }

        // Render todos
        function renderTodos() {
            const container = document.getElementById('todo-list');
            
            let filteredTodos = todos;
            
            // Apply filters
            switch (currentFilter) {
                case 'pending':
                    filteredTodos = todos.filter(todo => !todo.completed);
                    break;
                case 'completed':
                    filteredTodos = todos.filter(todo => todo.completed);
                    break;
                case 'high':
                    filteredTodos = todos.filter(todo => todo.priority === 'high');
                    break;
            }
            
            if (filteredTodos.length === 0) {
                container.innerHTML = '<div class="loading">No todos found</div>';
                return;
            }
            
            container.innerHTML = filteredTodos.map(todo => `
                <div class="todo-item ${todo.completed ? 'completed' : ''}">
                    <div class="todo-header">
                        <div class="todo-title">${escapeHtml(todo.title)}</div>
                        <span class="priority-badge priority-${todo.priority}">${todo.priority}</span>
                    </div>
                    
                    ${todo.description ? `<div class="todo-description">${escapeHtml(todo.description)}</div>` : ''}
                    
                    <div class="todo-actions">
                        <input type="checkbox" 
                               class="todo-checkbox" 
                               ${todo.completed ? 'checked' : ''}
                               onchange="toggleTodo(${todo.id}, this.checked)">
                        <button onclick="deleteTodo(${todo.id})" class="delete-btn">Delete</button>
                        <span class="todo-date">${formatDate(todo.created_at)}</span>
                    </div>
                </div>
            `).join('');
        }

        // Add new todo
        async function addTodo() {
            const title = document.getElementById('todo-title').value.trim();
            const description = document.getElementById('todo-description').value.trim();
            const priority = document.getElementById('todo-priority').value;
            
            if (!title) {
                showError('Please enter a todo title');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/todos`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        title,
                        description,
                        priority
                    })
                });
                
                if (!response.ok) throw new Error('Failed to add todo');
                
                // Clear form
                document.getElementById('todo-title').value = '';
                document.getElementById('todo-description').value = '';
                document.getElementById('todo-priority').value = 'medium';
                
                // Reload todos
                await loadTodos();
                await loadStats();
                clearError();
            } catch (error) {
                console.error('Error adding todo:', error);
                showError('Failed to add todo');
            }
        }

        // Toggle todo completion
        async function toggleTodo(id, completed) {
            try {
                const response = await fetch(`${API_BASE}/todos/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ completed })
                });
                
                if (!response.ok) throw new Error('Failed to update todo');
                
                await loadTodos();
                await loadStats();
                clearError();
            } catch (error) {
                console.error('Error updating todo:', error);
                showError('Failed to update todo');
            }
        }

        // Delete todo
        async function deleteTodo(id) {
            if (!confirm('Are you sure you want to delete this todo?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/todos/${id}`, {
                    method: 'DELETE'
                });
                
                if (!response.ok) throw new Error('Failed to delete todo');
                
                await loadTodos();
                await loadStats();
                clearError();
            } catch (error) {
                console.error('Error deleting todo:', error);
                showError('Failed to delete todo');
            }
        }

        // Filter todos
        function filterTodos(filter) {
            currentFilter = filter;
            
            // Update filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderTodos();
        }

        // Utility functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        function showError(message) {
            const container = document.getElementById('error-container');
            container.innerHTML = `<div class="error">${message}</div>`;
        }

        function clearError() {
            const container = document.getElementById('error-container');
            container.innerHTML = '';
        }

        // Allow adding todo with Enter key
        document.getElementById('todo-title').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addTodo();
        });
        
        document.getElementById('todo-description').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addTodo();
        });
    </script>
</body>
</html>
