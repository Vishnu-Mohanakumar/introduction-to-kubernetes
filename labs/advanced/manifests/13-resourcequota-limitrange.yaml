apiVersion: v1
kind: ResourceQuota
metadata:
  name: voting-app-quota
  namespace: voting-app
spec:
  hard:
    requests.cpu: "300m"
    requests.memory: "256Mi"
    limits.cpu: "900m"
    limits.memory: "900Mi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: voting-app-limits
  namespace: voting-app
spec:
  limits:
    - type: Container
      max:
        cpu: "500m"
        memory: "512Mi"
